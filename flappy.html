<!DOCTYPE html>
<html>
<head>
<title>Flappy Clone Pro</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    text-align: center;
    font-family: Arial;
    background: linear-gradient(#70c5ce, #4ec0ca);
}

canvas {
    display: block;
    margin: 0 auto;
}

#startBtn, #fullscreenBtn {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 25px;
    font-size: 18px;
    cursor: pointer;
}

#startBtn { top: 280px; }
#fullscreenBtn { top: 330px; }

#leaderboard {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(0,0,0,0.5);
    color: white;
    padding: 15px;
    border-radius: 10px;
    text-align: left;
}
</style>
</head>
<body>

<h1>🐦 Flappy Clone</h1>
<button id="startBtn">Start Game</button>
<button id="fullscreenBtn">Full Screen</button>

<div id="leaderboard">
    <h3>🏆 Leaderboard</h3>
    <ol id="scoreList"></ol>
</div>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const startBtn = document.getElementById("startBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const scoreList = document.getElementById("scoreList");

let gameState = "start";

let bird = {
    x: 80,
    y: 300,
    gravity: 0.6,
    lift: -10,
    velocity: 0,
    size: 20
};

let pipes = [];
let frame = 0;
let score = 0;

let leaderboard = JSON.parse(localStorage.getItem("flappyLeaderboard")) || [];

startBtn.onclick = startGame;
fullscreenBtn.onclick = () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
};

document.addEventListener("keydown", function(e) {
    if (e.code === "Space" && gameState === "playing") {
        bird.velocity = bird.lift;
    }
});

function startGame() {
    gameState = "playing";
    startBtn.style.display = "none";
    resetGame();
}

function resetGame() {
    bird.y = 300;
    bird.velocity = 0;
    pipes = [];
    frame = 0;
    score = 0;
}

function drawBird() {
    ctx.fillStyle = "yellow";
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.size, 0, Math.PI * 2);
    ctx.fill();
}

function drawPipes() {
    ctx.fillStyle = "green";
    pipes.forEach(pipe => {
        ctx.fillRect(pipe.x, 0, 50, pipe.top);
        ctx.fillRect(pipe.x, pipe.bottom, 50, canvas.height - pipe.bottom);
    });
}

function update() {
    if (gameState !== "playing") return;

    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    if (bird.y + bird.size > canvas.height || bird.y - bird.size < 0) {
        endGame();
    }

    if (frame % 90 === 0) {
        let top = Math.random() * 300 + 50;
        let gap = 150;
        pipes.push({
            x: canvas.width,
            top: top,
            bottom: top + gap
        });
    }

    pipes.forEach((pipe, i) => {
        pipe.x -= 3;

        if (
            bird.x + bird.size > pipe.x &&
            bird.x - bird.size < pipe.x + 50 &&
            (bird.y - bird.size < pipe.top || bird.y + bird.size > pipe.bottom)
        ) {
            endGame();
        }

        if (pipe.x + 50 < 0) {
            pipes.splice(i, 1);
            score++;
        }
    });

    frame++;
}

function endGame() {
    gameState = "start";
    startBtn.innerText = "Restart";
    startBtn.style.display = "block";

    saveScore(score);
    updateLeaderboard();
}

function saveScore(newScore) {
    leaderboard.push(newScore);
    leaderboard.sort((a, b) => b - a);
    leaderboard = leaderboard.slice(0, 5);
    localStorage.setItem("flappyLeaderboard", JSON.stringify(leaderboard));
}

function updateLeaderboard() {
    scoreList.innerHTML = "";
    leaderboard.forEach(score => {
        let li = document.createElement("li");
        li.textContent = score;
        scoreList.appendChild(li);
    });
}

function drawUI() {
    ctx.fillStyle = "white";
    ctx.font = "24px Arial";
    ctx.textAlign = "center";

    if (gameState === "start") {
        ctx.fillText("Press Start to Play", canvas.width/2, 250);
    }

    if (gameState === "playing") {
        ctx.fillText("Score: " + score, canvas.width/2, 50);
    }
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBird();
    drawPipes();
    update();
    drawUI();
    requestAnimationFrame(gameLoop);
}

updateLeaderboard();
gameLoop();
</script>

</body>
</html>
