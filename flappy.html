<!DOCTYPE html>
<html>
<head>
    <title>Flappy Clone</title>
    <style>
        body {
            margin: 0;
            background: skyblue;
            overflow: hidden;
            text-align: center;
            font-family: Arial;
        }
        canvas {
            background: #70c5ce;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<h1>🐦 Flappy Clone</h1>
<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let gameState = "start"; // start, playing, gameover

let bird = {
    x: 80,
    y: 300,
    gravity: 0.6,
    lift: -10,
    velocity: 0
};

let pipes = [];
let frame = 0;
let score = 0;

document.addEventListener("keydown", function(e) {
    if (e.code === "Space") {
        if (gameState === "start") {
            startGame();
        } else if (gameState === "playing") {
            bird.velocity = bird.lift;
        } else if (gameState === "gameover") {
            resetGame();
        }
    }
});

function startGame() {
    gameState = "playing";
}

function resetGame() {
    gameState = "start";
    bird.y = 300;
    bird.velocity = 0;
    pipes = [];
    frame = 0;
    score = 0;
}

function drawBird() {
    ctx.fillStyle = "yellow";
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, 15, 0, Math.PI * 2);
    ctx.fill();
}

function drawPipes() {
    ctx.fillStyle = "green";
    pipes.forEach(pipe => {
        ctx.fillRect(pipe.x, 0, 50, pipe.top);
        ctx.fillRect(pipe.x, pipe.bottom, 50, canvas.height - pipe.bottom);
    });
}

function update() {
    if (gameState !== "playing") return;

    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    if (bird.y + 15 > canvas.height || bird.y - 15 < 0) {
        gameState = "gameover";
    }

    if (frame % 90 === 0) {
        let top = Math.random() * 300 + 50;
        let gap = 150;
        pipes.push({
            x: canvas.width,
            top: top,
            bottom: top + gap
        });
    }

    pipes.forEach((pipe, i) => {
        pipe.x -= 3;

        if (
            bird.x + 15 > pipe.x &&
            bird.x - 15 < pipe.x + 50 &&
            (bird.y - 15 < pipe.top || bird.y + 15 > pipe.bottom)
        ) {
            gameState = "gameover";
        }

        if (pipe.x + 50 < 0) {
            pipes.splice(i, 1);
            score++;
        }
    });

    frame++;
}

function drawUI() {
    ctx.fillStyle = "white";
    ctx.font = "30px Arial";
    ctx.textAlign = "center";

    if (gameState === "start") {
        ctx.fillText("Press SPACE to Start", canvas.width / 2, 300);
    }

    if (gameState === "playing") {
        ctx.fillText("Score: " + score, canvas.width / 2, 50);
    }

    if (gameState === "gameover") {
        ctx.fillText("Game Over", canvas.width / 2, 260);
        ctx.fillText("Score: " + score, canvas.width / 2, 310);
        ctx.fillText("Press SPACE to Restart", canvas.width / 2, 360);
    }
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBird();
    drawPipes();
    update();
    drawUI();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
