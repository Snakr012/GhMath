<!DOCTYPE html>
<html>
<head>
<title>Idle Empire X — Expansion Edition</title>
<style>
body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
    text-align:center;
}
button{
    padding:8px 15px;
    margin:5px;
    background:#00ffcc;
    border:none;
    cursor:pointer;
    font-weight:bold;
}
button:hover{ background:#00ccaa; }
.panel{
    margin:15px;
    padding:15px;
    border:1px solid #00ffcc;
}
select{ padding:5px; margin-left:5px; }
#saveStatus{ margin-left:10px; color:#0f0; font-weight:bold; }
</style>
</head>
<body>

<h1>🌍 Idle Empire X</h1>

<h2>💰 Gold: <span id="gold">0</span></h2>
<h3>⚡ Energy: <span id="energy">0</span></h3>
<h3>💎 Gems: <span id="gems">0</span></h3>

<button onclick="clickGold()">CLICK</button>

<div class="panel">
<h3>🏭 Resource Production</h3>

<p>Auto Clickers: <span id="autoClickers">0</span></p>
<label for="bulkSelect">Buy in bulk:</label>
<select id="bulkSelect">
  <option value="1">1</option>
  <option value="5">5</option>
  <option value="10">10</option>
  <option value="50">50</option>
</select><br>
<button id="buyAutoBtn" onclick="buyAuto()">Buy Auto (100 Gold)</button>

<p>Energy Generators: <span id="generators">0</span></p>
<button id="buyGenBtn" onclick="buyGenerator()">Buy Generator (200 Gold)</button>
</div>

<div class="panel">
<h3>💎 Gem Shop</h3>
<button onclick="buyGemBoost()">Permanent +1 Click (5 Gems)</button>
<button onclick="buyEnergyBoost()">Energy Boost (5 Gems)</button>
<button onclick="unlockSkill('energyEfficiency')">Energy Efficiency (3 Gems)</button>
<button onclick="unlockSkill('energyMastery')">Energy Mastery (3 Gems)</button>
</div>

<div class="panel">
<h3>🌎 World Expansion</h3>
<p>World Level: <span id="worldLevel">1</span></p>
<button onclick="expandWorld()">Expand (1000 Gold + 500 Energy)</button>
</div>

<div class="panel">
<h3>⚡ Energy Actions</h3>
<button onclick="activateBoost()">Activate Boost (200 Energy)</button>
<button onclick="craftGem()">Craft Gem (5000 Gold + 1000 Energy)</button>
</div>

<div class="panel">
<h3>💾 Save / Load</h3>
<button onclick="manualSave()">💾 Save Game</button>
<button onclick="manualLoad()">📂 Load Game</button>
<button onclick="resetGame()">❌ Reset Game</button>
<span id="saveStatus"></span>
</div>

<div class="panel">
<h3>🏆 Achievements</h3>
<ul id="achievements"></ul>
</div>

<br>
<button onclick="goBack()">⬅ Back to Hub</button>

<script>
// ======== GAME STATE OBJECT ========
let gameData = {
    gold:0, energy:0, gems:0,
    autoClickers:0, generators:0,
    worldLevel:1, clickValue:1,
    gemClickBoost:0, energyBoost:0,
    skills:{}, achievements:[],
    energyUsedForBoosts:0, gemsCrafted:0, worldsExpandedWithEnergy:0,
    boostActive:false
};

// ======== LOAD ON START ========
if(localStorage.getItem("empireSave")){
    let s = JSON.parse(localStorage.getItem("empireSave"));
    gameData = s;
    let offline = (Date.now() - (s.lastPlayed || Date.now()))/1000;
    gameData.gold += offline * gameData.autoClickers;
    gameData.energy += offline * gameData.generators;
}

// ======== CLICK ========
function clickGold(){ gameData.gold += gameData.clickValue + gameData.gemClickBoost; }

// ======== BULK PURCHASE ========
function getBulk(){ return parseInt(document.getElementById("bulkSelect").value); }
function buyAuto(){
    let bulk=getBulk(); let cost=100*bulk;
    if(gameData.gold>=cost){ gameData.gold-=cost; gameData.autoClickers+=bulk; }
    else alert("Not enough Gold!");
}
function buyGenerator(){
    let bulk=getBulk(); let cost=200*bulk;
    if(gameData.gold>=cost){ gameData.gold-=cost; gameData.generators+=bulk; }
    else alert("Not enough Gold!");
}
function updateButtonCosts(){
    let bulk=getBulk();
    document.getElementById("buyAutoBtn").textContent=`Buy Auto (${bulk*100} Gold)`;
    document.getElementById("buyGenBtn").textContent=`Buy Generator (${bulk*200} Gold)`;
}
document.getElementById("bulkSelect").addEventListener("change",updateButtonCosts);
updateButtonCosts();

// ======== GEM SHOP ========
function buyGemBoost(){ if(gameData.gems>=5){ gameData.gems-=5; gameData.gemClickBoost++; } }
function buyEnergyBoost(){ if(gameData.gems>=5){ gameData.gems-=5; gameData.energyBoost++; } }
function unlockSkill(skill){ if(gameData.gems>=3 && !gameData.skills[skill]){ gameData.gems-=3; gameData.skills[skill]=true; alert("Skill Unlocked!"); } }

// ======== WORLD EXPANSION ========
function expandWorld(){
    let goldCost=1000, energyCost=500;
    if(gameData.skills.energyEfficiency) energyCost=Math.floor(energyCost/2);
    if(gameData.gold>=goldCost && gameData.energy>=energyCost){
        gameData.gold-=goldCost; gameData.energy-=energyCost;
        gameData.worldLevel++; gameData.worldsExpandedWithEnergy++;
        alert("New World Unlocked!"); checkAchievements();
    } else alert("Not enough Gold or Energy!");
}

// ======== BOOSTS ========
function activateBoost(){
    let boostCost=200; if(gameData.skills.energyEfficiency) boostCost=Math.floor(boostCost/2);
    const boostDuration=10000;
    if(gameData.energy>=boostCost && !gameData.boostActive){
        gameData.energy-=boostCost; gameData.boostActive=true; gameData.energyUsedForBoosts+=boostCost;
        alert("Boost Activated! Gold & Energy production doubled for 10 seconds.");
        setTimeout(()=>{ gameData.boostActive=false; alert("Boost Ended!"); checkAchievements(); }, boostDuration);
    } else if(gameData.boostActive) alert("Boost already active!");
    else alert("Not enough Energy!");
}

// ======== CRAFT GEM ========
function craftGem(){
    let goldCost=5000, energyCost=1000;
    if(gameData.skills.energyEfficiency) energyCost=Math.floor(energyCost/2);
    if(gameData.gold>=goldCost && gameData.energy>=energyCost){
        gameData.gold-=goldCost; gameData.energy-=energyCost; gameData.gems++; gameData.gemsCrafted++;
        alert("You crafted 1 Gem!"); checkAchievements();
    } else alert("Not enough Gold or Energy!");
}

// ======== AUTO PRODUCTION ========
setInterval(()=>{
    let goldMultiplier=gameData.worldLevel*(gameData.skills.goldBoost?2:1)*(gameData.boostActive?2:1);
    let energyMultiplier=(1+gameData.energyBoost)*(gameData.skills.energyBoost?2:1)*(gameData.boostActive?2:1);
    if(gameData.skills.energyMastery) energyMultiplier=Math.floor(energyMultiplier*1.5);
    gameData.gold += gameData.autoClickers*goldMultiplier;
    gameData.energy += gameData.generators*energyMultiplier;
    checkAchievements();
},1000);

// ======== ACHIEVEMENTS ========
function checkAchievements(){
    if(gameData.gold>=10000 && !gameData.achievements.includes("Rich")){ gameData.achievements.push("Rich"); gameData.gems+=5; alert("Achievement: Rich (+5 Gems)"); }
    if(gameData.worldLevel>=5 && !gameData.achievements.includes("Explorer")){ gameData.achievements.push("Explorer"); gameData.gems+=5; alert("Achievement: Explorer (+5 Gems)"); }
    if(gameData.energyUsedForBoosts>=200 && !gameData.achievements.includes("Energetic")){ gameData.achievements.push("Energetic"); gameData.gems+=2; alert("Achievement: Energetic (+2 Gems)"); }
    if(gameData.gemsCrafted>=5 && !gameData.achievements.includes("Crafty")){ gameData.achievements.push("Crafty"); gameData.gems+=5; alert("Achievement: Crafty (+5 Gems)"); }
    if(gameData.worldsExpandedWithEnergy>=3 && !gameData.achievements.includes("World Power")){ gameData.achievements.push("World Power"); gameData.gems+=5; alert("Achievement: World Power (+5 Gems)"); }
}
function updateAchievements(){
    let ul=document.getElementById("achievements"); ul.innerHTML="";
    gameData.achievements.forEach(a=>{ let li=document.createElement("li"); li.textContent=a; ul.appendChild(li); });
}

// ======== SAVE / LOAD / RESET ========
function manualSave(){
    gameData.lastPlayed = Date.now();
    localStorage.setItem("empireSave", JSON.stringify(gameData));
    const status=document.getElementById("saveStatus");
    status.textContent="💾 Game Saved!";
    setTimeout(()=>{ status.textContent=""; },2000);
}
function manualLoad(){
    if(localStorage.getItem("empireSave")){
        let s = JSON.parse(localStorage.getItem("empireSave"));
        gameData = s;
        updateUI();
        const status=document.getElementById("saveStatus");
        status.textContent="📂 Game Loaded!";
        setTimeout(()=>{ status.textContent=""; },2000);
    } else alert("No save found.");
}
function resetGame(){
    if(confirm("Are you sure you want to reset your game? This cannot be undone.")){
        localStorage.removeItem("empireSave");
        gameData = {
            gold:0, energy:0, gems:0,
            autoClickers:0, generators:0,
            worldLevel:1, clickValue:1,
            gemClickBoost:0, energyBoost:0,
            skills:{}, achievements:[],
            energyUsedForBoosts:0, gemsCrafted:0, worldsExpandedWithEnergy:0,
            boostActive:false
        };
        updateUI();
    }
}

// ======== UI ========
function updateUI(){
    document.getElementById("gold").textContent = Math.floor(gameData.gold);
    document.getElementById("energy").textContent = Math.floor(gameData.energy);
    document.getElementById("gems").textContent = gameData.gems;
    document.getElementById("autoClickers").textContent = gameData.autoClickers;
    document.getElementById("generators").textContent = gameData.generators;
    document.getElementById("worldLevel").textContent = gameData.worldLevel;
    updateAchievements();
}

// ======== BACK BUTTON ========
function goBack(){ window.location.href = window.location.origin+"/"+window.location.pathname.split("/")[1]+"/"; }

// ======== SILENT AUTO SAVE ========
setInterval(()=>{ manualSave(); },2000);

// ======== GAME LOOP ========
function gameLoop(){ updateUI(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>

</body>
</html>
