<!DOCTYPE html>
<html>
<head>
<title>Idle Empire X — Expansion Edition</title>
<style>
body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
    text-align:center;
}
button{
    padding:8px 15px;
    margin:5px;
    background:#00ffcc;
    border:none;
    cursor:pointer;
    font-weight:bold;
}
button:hover{ background:#00ccaa; }
.panel{
    margin:15px;
    padding:15px;
    border:1px solid #00ffcc;
}
select{ padding:5px; margin-left:5px; }
#saveStatus{ margin-left:10px; color:#0f0; font-weight:bold; }
</style>
</head>
<body>

<h1>🌍 Idle Empire X</h1>

<h2>💰 Gold: <span id="gold">0</span></h2>
<h3>⚡ Energy: <span id="energy">0</span></h3>
<h3>💎 Gems: <span id="gems">0</span></h3>

<button onclick="clickGold()">CLICK</button>

<div class="panel">
<h3>🏭 Resource Production</h3>

<p>Auto Clickers: <span id="autoClickers">0</span></p>
<label for="bulkSelect">Buy in bulk:</label>
<select id="bulkSelect">
  <option value="1">1</option>
  <option value="5">5</option>
  <option value="10">10</option>
  <option value="50">50</option>
</select><br>
<button id="buyAutoBtn" onclick="buyAuto()">Buy Auto (100 Gold)</button>

<p>Energy Generators: <span id="generators">0</span></p>
<button id="buyGenBtn" onclick="buyGenerator()">Buy Generator (200 Gold)</button>
</div>

<div class="panel">
<h3>💎 Gem Shop</h3>
<button onclick="buyGemBoost()">Permanent +1 Click (5 Gems)</button>
<button onclick="buyEnergyBoost()">Energy Boost (5 Gems)</button>
<button onclick="unlockSkill('energyEfficiency')">Energy Efficiency (3 Gems)</button>
<button onclick="unlockSkill('energyMastery')">Energy Mastery (3 Gems)</button>
</div>

<div class="panel">
<h3>🌎 World Expansion</h3>
<p>World Level: <span id="worldLevel">1</span></p>
<button onclick="expandWorld()">Expand (1000 Gold + 500 Energy)</button>
</div>

<div class="panel">
<h3>⚡ Energy Actions</h3>
<button onclick="activateBoost()">Activate Boost (200 Energy)</button>
<button onclick="craftGem()">Craft Gem (5000 Gold + 1000 Energy)</button>
</div>

<div class="panel">
<h3>💾 Save / Load</h3>
<button onclick="manualSave()">💾 Save Game</button>
<button onclick="manualLoad()">📂 Load Game</button>
<button onclick="resetGame()">❌ Reset Game</button>
<span id="saveStatus"></span>
</div>

<div class="panel">
<h3>🏆 Achievements</h3>
<ul id="achievements"></ul>
</div>

<br>
<button onclick="goBack()">⬅ Back to Hub</button>

<script>
let gold=0, energy=0, gems=0;
let autoClickers=0, generators=0;
let worldLevel=1;
let clickValue=1, gemClickBoost=0, energyBoost=0;
let skills={}, achievements=[], boostActive=false;

// Trackers
let energyUsedForBoosts=0, gemsCrafted=0, worldsExpandedWithEnergy=0;

// LOAD ON START
if(localStorage.getItem("empireSave")){
    let s=JSON.parse(localStorage.getItem("empireSave"));
    gold = s.gold || 0;
    energy = s.energy || 0;
    gems = s.gems || 0;
    autoClickers = s.autoClickers || 0;
    generators = s.generators || 0;
    worldLevel = s.worldLevel || 1;
    clickValue = s.clickValue || 1;
    gemClickBoost = s.gemClickBoost || 0;
    energyBoost = s.energyBoost || 0;
    skills = s.skills || {};
    achievements = s.achievements || [];
    energyUsedForBoosts = s.energyUsedForBoosts || 0;
    gemsCrafted = s.gemsCrafted || 0;
    worldsExpandedWithEnergy = s.worldsExpandedWithEnergy || 0;

    let offline=(Date.now()-s.lastPlayed)/1000;
    gold += offline*autoClickers;
    energy += offline*generators;
}

// CLICK
function clickGold(){ gold += clickValue + gemClickBoost; }

// BULK PURCHASE
function getBulk(){ return parseInt(document.getElementById("bulkSelect").value); }
function buyAuto(){
    let bulk=getBulk(); let cost=100*bulk;
    if(gold>=cost){ gold-=cost; autoClickers+=bulk; }
    else alert("Not enough Gold to buy "+bulk+" Auto Clickers!");
}
function buyGenerator(){
    let bulk=getBulk(); let cost=200*bulk;
    if(gold>=cost){ gold-=cost; generators+=bulk; }
    else alert("Not enough Gold to buy "+bulk+" Generators!");
}
function updateButtonCosts(){
    let bulk=getBulk();
    document.getElementById("buyAutoBtn").textContent=`Buy Auto (${bulk*100} Gold)`;
    document.getElementById("buyGenBtn").textContent=`Buy Generator (${bulk*200} Gold)`;
}
document.getElementById("bulkSelect").addEventListener("change",updateButtonCosts);
updateButtonCosts();

// GEM SHOP
function buyGemBoost(){ if(gems>=5){ gems-=5; gemClickBoost++; } }
function buyEnergyBoost(){ if(gems>=5){ gems-=5; energyBoost++; } }
function unlockSkill(skill){ if(gems>=3 && !skills[skill]){ gems-=3; skills[skill]=true; alert("Skill Unlocked!"); } }

// WORLD EXPANSION
function expandWorld(){
    let goldCost=1000, energyCost=500;
    if(skills.energyEfficiency) energyCost=Math.floor(energyCost/2);
    if(gold>=goldCost && energy>=energyCost){
        gold-=goldCost; energy-=energyCost; worldLevel++; worldsExpandedWithEnergy++;
        alert("New World Unlocked!"); checkAchievements();
    } else alert("Not enough Gold or Energy to expand!");
}

// BOOSTS
function activateBoost(){
    let boostCost=200; if(skills.energyEfficiency) boostCost=Math.floor(boostCost/2);
    const boostDuration=10000;
    if(energy>=boostCost && !boostActive){
        energy-=boostCost; boostActive=true; energyUsedForBoosts+=boostCost;
        alert("Boost Activated! Gold & Energy production doubled for 10 seconds.");
        setTimeout(()=>{ boostActive=false; alert("Boost Ended!"); checkAchievements(); }, boostDuration);
    } else if(boostActive) alert("Boost already active!");
    else alert("Not enough Energy!");
}

// CRAFT GEM
function craftGem(){
    let goldCost=5000, energyCost=1000;
    if(skills.energyEfficiency) energyCost=Math.floor(energyCost/2);
    if(gold>=goldCost && energy>=energyCost){
        gold-=goldCost; energy-=energyCost; gems++; gemsCrafted++;
        alert("You crafted 1 Gem!"); checkAchievements();
    } else alert("Not enough Gold or Energy to craft a gem!");
}

// AUTO PRODUCTION
setInterval(()=>{
    let goldMultiplier=worldLevel*(skills.goldBoost?2:1)*(boostActive?2:1);
    let energyMultiplier=(1+energyBoost)*(skills.energyBoost?2:1)*(boostActive?2:1);
    if(skills.energyMastery) energyMultiplier=Math.floor(energyMultiplier*1.5);
    gold += autoClickers*goldMultiplier;
    energy += generators*energyMultiplier;
    checkAchievements();
},1000);

// ACHIEVEMENTS
function checkAchievements(){
    if(gold>=10000 && !achievements.includes("Rich")){ achievements.push("Rich"); gems+=5; alert("Achievement: Rich (+5 Gems)"); }
    if(worldLevel>=5 && !achievements.includes("Explorer")){ achievements.push("Explorer"); gems+=5; alert("Achievement: Explorer (+5 Gems)"); }
    if(energyUsedForBoosts>=200 && !achievements.includes("Energetic")){ achievements.push("Energetic"); gems+=2; alert("Achievement: Energetic (+2 Gems)"); }
    if(gemsCrafted>=5 && !achievements.includes("Crafty")){ achievements.push("Crafty"); gems+=5; alert("Achievement: Crafty (+5 Gems)"); }
    if(worldsExpandedWithEnergy>=3 && !achievements.includes("World Power")){ achievements.push("World Power"); gems+=5; alert("Achievement: World Power (+5 Gems)"); }
}
function updateAchievements(){ let ul=document.getElementById("achievements"); ul.innerHTML=""; achievements.forEach(a=>{ let li=document.createElement("li"); li.textContent=a; ul.appendChild(li); }); }

// SAVE / LOAD / RESET
function manualSave(){
    localStorage.setItem("empireSave",JSON.stringify({
        gold, energy, gems,
        autoClickers, generators,
        worldLevel, clickValue,
        gemClickBoost, energyBoost,
        skills, achievements,
        energyUsedForBoosts, gemsCrafted, worldsExpandedWithEnergy,
        lastPlayed:Date.now()
    }));
    const status=document.getElementById("saveStatus");
    status.textContent="💾 Game Saved!";
    setTimeout(()=>{ status.textContent=""; },2000);
}
function manualLoad(){
    if(localStorage.getItem("empireSave")){
        let s=JSON.parse(localStorage.getItem("empireSave"));
        gold = s.gold || 0;
        energy = s.energy || 0;
        gems = s.gems || 0;
        autoClickers = s.autoClickers || 0;
        generators = s.generators || 0;
        worldLevel = s.worldLevel || 1;
        clickValue = s.clickValue || 1;
        gemClickBoost = s.gemClickBoost || 0;
        energyBoost = s.energyBoost || 0;
        skills = s.skills || {};
        achievements = s.achievements || [];
        energyUsedForBoosts = s.energyUsedForBoosts || 0;
        gemsCrafted = s.gemsCrafted || 0;
        worldsExpandedWithEnergy = s.worldsExpandedWithEnergy || 0;

        updateUI();
        const status=document.getElementById("saveStatus");
        status.textContent="📂 Game Loaded!";
        setTimeout(()=>{ status.textContent=""; },2000);
    } else alert("No save found.");
}
function resetGame(){
    if(confirm("Are you sure you want to reset your game? This cannot be undone.")){
        localStorage.removeItem("empireSave");
        gold=0; energy=0; gems=0;
        autoClickers=0; generators=0; worldLevel=1;
        clickValue=1; gemClickBoost=0; energyBoost=0;
        skills={}; achievements=[];
        energyUsedForBoosts=0; gemsCrafted=0; worldsExpandedWithEnergy=0;
        updateUI();
    }
}

// UI
function updateUI(){
    document.getElementById("gold").textContent=Math.floor(gold);
    document.getElementById("energy").textContent=Math.floor(energy);
    document.getElementById("gems").textContent=gems;
    document.getElementById("autoClickers").textContent=autoClickers;
    document.getElementById("generators").textContent=generators;
    document.getElementById("worldLevel").textContent=worldLevel;
    updateAchievements();
}

// BACK BUTTON
function goBack(){ window.location.href=window.location.origin+"/"+window.location.pathname.split("/")[1]+"/"; }

// SILENT AUTO SAVE
setInterval(()=>{ manualSave(); },2000);

// GAME LOOP
function gameLoop(){ updateUI(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>

</body>
</html>
