<!DOCTYPE html>
<html>
<head>
<title>Idle Empire X</title>
<style>
body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
    text-align:center;
}
button{
    padding:8px 15px;
    margin:5px;
    background:#00ffcc;
    border:none;
    cursor:pointer;
    font-weight:bold;
}
button:hover{ background:#00ccaa; }
.panel{
    margin:15px;
    padding:15px;
    border:1px solid #00ffcc;
}
</style>
</head>
<body>

<h1>🌍 Idle Empire X</h1>

<h2>💰 Gold: <span id="gold">0</span></h2>
<h3>⚡ Energy: <span id="energy">0</span></h3>
<h3>💎 Gems: <span id="gems">0</span></h3>

<button onclick="clickGold()">CLICK</button>

<div class="panel">
<h3>🏭 Resource Production</h3>
<p>Auto Clickers: <span id="autoClickers">0</span></p>
<button onclick="buyAuto()">Buy Auto (100 Gold)</button>

<p>Energy Generators: <span id="generators">0</span></p>
<button onclick="buyGenerator()">Buy Generator (200 Gold)</button>
</div>

<div class="panel">
<h3>💎 Gem Shop</h3>
<button onclick="buyGemBoost()">Permanent +1 Click (5 Gems)</button>
<button onclick="buyEnergyBoost()">Energy Boost (5 Gems)</button>
</div>

<div class="panel">
<h3>🌎 World Expansion</h3>
<p>World Level: <span id="worldLevel">1</span></p>
<button onclick="expandWorld()">Expand (1000 Gold)</button>
</div>

<div class="panel">
<h3>🧠 Skill Tree</h3>
<button onclick="unlockSkill('goldBoost')">Gold Boost (3 Gems)</button>
<button onclick="unlockSkill('energyBoost')">Energy Boost (3 Gems)</button>
</div>

<div class="panel">
<h3>🏆 Achievements</h3>
<ul id="achievements"></ul>
</div>

<br>
<button onclick="goBack()">⬅ Back to Hub</button>

<script>
let gold=0, energy=0, gems=0;
let autoClickers=0, generators=0;
let worldLevel=1;

let clickValue=1;
let gemClickBoost=0;
let energyBoost=0;

let skills={};
let achievements=[];

// LOAD
if(localStorage.getItem("empireSave")){
    let s=JSON.parse(localStorage.getItem("empireSave"));
    Object.assign(window,s);

    let offline=(Date.now()-s.lastPlayed)/1000;
    gold += offline * autoClickers;
    energy += offline * generators;
}

// CLICK
function clickGold(){
    gold += clickValue + gemClickBoost;
}

// BUYERS
function buyAuto(){
    if(gold>=100){
        gold-=100;
        autoClickers++;
    }
}
function buyGenerator(){
    if(gold>=200){
        gold-=200;
        generators++;
    }
}

// GEM SHOP
function buyGemBoost(){
    if(gems>=5){
        gems-=5;
        gemClickBoost++;
    }
}
function buyEnergyBoost(){
    if(gems>=5){
        gems-=5;
        energyBoost++;
    }
}

// WORLD
function expandWorld(){
    if(gold>=1000){
        gold-=1000;
        worldLevel++;
        alert("New World Unlocked!");
    }
}

// SKILLS
function unlockSkill(skill){
    if(gems>=3 && !skills[skill]){
        gems-=3;
        skills[skill]=true;
        alert("Skill Unlocked!");
    }
}

// AUTO PRODUCTION
setInterval(()=>{
    gold += autoClickers * worldLevel * (skills.goldBoost?2:1);
    energy += generators * (1+energyBoost) * (skills.energyBoost?2:1);
    checkAchievements();
},1000);

// ACHIEVEMENTS
function checkAchievements(){
    if(gold>=10000 && !achievements.includes("Rich")){
        achievements.push("Rich");
        gems+=5;
        alert("Achievement: Rich (+5 Gems)");
    }
    if(worldLevel>=5 && !achievements.includes("Explorer")){
        achievements.push("Explorer");
        gems+=5;
        alert("Achievement: Explorer (+5 Gems)");
    }
}

function updateAchievements(){
    let ul=document.getElementById("achievements");
    ul.innerHTML="";
    achievements.forEach(a=>{
        let li=document.createElement("li");
        li.textContent=a;
        ul.appendChild(li);
    });
}

// SAVE
setInterval(()=>{
localStorage.setItem("empireSave",JSON.stringify({
gold,energy,gems,
autoClickers,generators,
worldLevel,clickValue,
gemClickBoost,energyBoost,
skills,achievements,
lastPlayed:Date.now()
}));
},2000);

// UI
function updateUI(){
document.getElementById("gold").textContent=Math.floor(gold);
document.getElementById("energy").textContent=Math.floor(energy);
document.getElementById("gems").textContent=gems;
document.getElementById("autoClickers").textContent=autoClickers;
document.getElementById("generators").textContent=generators;
document.getElementById("worldLevel").textContent=worldLevel;
updateAchievements();
}

// BACK BUTTON
function goBack(){
window.location.href = window.location.origin + "/" + window.location.pathname.split("/")[1] + "/";
}

function gameLoop(){
updateUI();
requestAnimationFrame(gameLoop);
}
gameLoop();
</script>

</body>
</html>
