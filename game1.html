<!DOCTYPE html>
<html>
<head>
    <title>Clicker Game</title>
    <style>
        body {
            background: black;
            color: white;
            text-align: center;
            font-family: Arial;
        }
        button {
            font-size: 30px;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>🔥 Clicker Game 🔥</h1>
<p>Score: <span id="score">0</span></p>

<button onclick="addPoint()">CLICK ME</button>

<script>
let score = 0;

function addPoint() {
    score++;
    document.getElementById("score").innerText = score;
}
</script>

</body>
</html>
