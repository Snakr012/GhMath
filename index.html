<!DOCTYPE html>
<html>
<head>
    <title>Snakr Game Portal</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(black, #111);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        h1 {
            padding: 20px;
            font-size: 40px;
            color: lime;
        }

        .game-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            padding: 30px;
        }

        .game-card {
            background: #1a1a1a;
            border-radius: 15px;
            width: 250px;
            padding: 15px;
            transition: 0.3s;
            box-shadow: 0 0 10px #000;
        }

        .game-card:hover {
            transform: scale(1.08);
            box-shadow: 0 0 20px lime;
        }

        .game-card h2 {
            margin: 10px 0;
        }

        .play-button {
            display: inline-block;
            padding: 10px 20px;
            background: lime;
            color: black;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .play-button:hover {
            background: white;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            font-size: 14px;
            color: gray;
        }
    </style>
</head>
<body>

<h1>🎮 Snakr Game Portal 🎮</h1>

<div class="game-container">

    <div class="game-card">
        <h2>🔥 Clicker Game</h2>
        <p>Click as fast as you can!</p>
        <a href="game1.html" class="play-button">Play Now</a>
    </div>

    <h2>🐍 Snake Game</h2>
    <p>Classic arcade snake!</p>
    <a href="snake.html" class="play-button">Play Now</a>
</div>

    <div class="game-card">
    <h2>✈ Fighter Jet</h2>
    <p>Shoot down enemy jets!</p>
    <a href="fighter.html" class="play-button">Play Now</a>
</div>
    <div class="game-card">
    <h2>🧟 Zombie Survival</h2>
    <p>Survive endless zombie waves!</p>
    <a href="zombie.html" class="play-button">Play Now</a>
</div>














    
    <footer>
    © 2026 Snakr Games | Free Browser Games
</footer>
<button id="settingsBtn" style="
position:fixed;
top:20px;
right:20px;
padding:10px 15px;
background:lime;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
">
⚙ Settings
</button>

<div id="settingsPanel" style="
display:none;
position:fixed;
top:60px;
right:20px;
background:#1a1a1a;
padding:20px;
border-radius:15px;
box-shadow:0 0 20px black;
text-align:center;
">
<h3>Change Background</h3>
<input type="file" id="bgUpload" accept="image/*">
<br><br>
<button onclick="resetBg()">Reset</button>
</div>

<script>
const settingsBtn = document.getElementById("settingsBtn");
const panel = document.getElementById("settingsPanel");
const upload = document.getElementById("bgUpload");

// Toggle panel
settingsBtn.onclick = () => {
    panel.style.display = panel.style.display === "none" ? "block" : "none";
};

// Load saved background
const savedBg = localStorage.getItem("customBg");
if (savedBg) {
    document.body.style.backgroundImage = `url(${savedBg})`;
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundAttachment = "fixed";
}

// When user uploads file
upload.onchange = function() {
    const file = this.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
        const imageData = e.target.result;
        document.body.style.backgroundImage = `url(${imageData})`;
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundAttachment = "fixed";
        localStorage.setItem("customBg", imageData);
    };
    reader.readAsDataURL(file);
};

// Reset function
function resetBg() {
    localStorage.removeItem("customBg");
    document.body.style.backgroundImage = "";
}
</script>
    <script>
// ===== PLAYER DATA SYSTEM =====
let playerData = JSON.parse(localStorage.getItem("playerHubData")) || {
    xp: 0,
    level: 1,
    skinsUnlocked: 0,
    secretUnlocked: false,
    totalScore: 0
};

function savePlayer() {
    localStorage.setItem("playerHubData", JSON.stringify(playerData));
}

function addXP(amount) {
    playerData.xp += amount;
    playerData.totalScore += amount;

    // Level up system
    let requiredXP = playerData.level * 100;
    if (playerData.xp >= requiredXP) {
        playerData.xp -= requiredXP;
        playerData.level++;
        alert("LEVEL UP! You are now Level " + playerData.level);
    }

    // Unlock skins
    if (playerData.level >= 3) {
        playerData.skinsUnlocked = 1;
    }
    if (playerData.level >= 5) {
        playerData.skinsUnlocked = 2;
    }

    // Unlock secret game
    if (playerData.level >= 7) {
        playerData.secretUnlocked = true;
    }

    savePlayer();
}

function showPlayerStats() {
    let statsBox = document.createElement("div");
    statsBox.style.position = "fixed";
    statsBox.style.top = "10px";
    statsBox.style.left = "10px";
    statsBox.style.background = "black";
    statsBox.style.color = "white";
    statsBox.style.padding = "10px";
    statsBox.style.borderRadius = "8px";
    statsBox.innerHTML = `
        <b>Level:</b> ${playerData.level}<br>
        <b>XP:</b> ${playerData.xp}<br>
        <b>Total Score:</b> ${playerData.totalScore}
    `;
    document.body.appendChild(statsBox);
}

showPlayerStats();
</script>
</body>
</html>
