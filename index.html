<!DOCTYPE html>
<html>
<head>
    <title>Snakr Game Portal</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(black, #111);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        h1 {
            padding: 20px;
            font-size: 40px;
            color: lime;
        }

        .game-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            padding: 30px;
        }

        .game-card {
            background: #1a1a1a;
            border-radius: 15px;
            width: 250px;
            padding: 15px;
            transition: 0.3s;
            box-shadow: 0 0 10px #000;
        }

        .game-card:hover {
            transform: scale(1.08);
            box-shadow: 0 0 20px lime;
        }

        .game-card h2 {
            margin: 10px 0;
        }

        .play-button {
            display: inline-block;
            padding: 10px 20px;
            background: lime;
            color: black;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .play-button:hover {
            background: white;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            font-size: 14px;
            color: gray;
        }
    </style>
</head>
<body>

<h1>🎮 Snakr Game Portal 🎮</h1>

<div class="game-container">

    <div class="game-card">
        <h2>🔥 Clicker Game</h2>
        <p>Click as fast as you can!</p>
        <a href="game1.html" class="play-button">Play Now</a>
    </div>

    <div class="game-card">
        <h2>🕹 Coming Soon</h2>
        <p>New game loading...</p>
        <a href="#" class="play-button">Soon</a>
    </div>

</div>

<footer>
    © 2026 Snakr Games | Free Browser Games
</footer>

</body>
</html>
