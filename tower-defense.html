<!DOCTYPE html>
<html>
<head>
<title>Tower Defense X</title>
<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}
canvas{
    background:#1a1a1a;
    display:block;
    margin:auto;
}
button{
    padding:10px 20px;
    background:#00ffcc;
    border:none;
    cursor:pointer;
    font-weight:bold;
}
#ui{
    padding:10px;
}
</style>
</head>
<body>

<h1>🏰 Tower Defense X</h1>

<div id="ui">
Gold: <span id="gold">100</span> |
Wave: <span id="wave">1</span> |
Lives: <span id="lives">10</span>
<br><br>
<button onclick="startWave()">Start Wave</button>
<button onclick="goBack()">⬅ Back to Hub</button>
</div>

<canvas id="gameCanvas" width="900" height="500"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let gold = 100;
let wave = 1;
let lives = 10;

let enemies = [];
let towers = [];
let bullets = [];

const path = [
    {x:0, y:250},
    {x:900, y:250}
];

class Enemy{
    constructor(){
        this.x = path[0].x;
        this.y = path[0].y;
        this.speed = 2;
        this.health = 30;
    }

    update(){
        this.x += this.speed;
        if(this.x > canvas.width){
            lives--;
            enemies.splice(enemies.indexOf(this),1);
        }
    }

    draw(){
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(this.x,this.y,15,0,Math.PI*2);
        ctx.fill();
    }
}

class Tower{
    constructor(x,y){
        this.x=x;
        this.y=y;
        this.range=120;
        this.cooldown=0;
    }

    update(){
        if(this.cooldown>0) this.cooldown--;

        for(let enemy of enemies){
            let dx = enemy.x - this.x;
            let dy = enemy.y - this.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if(dist < this.range && this.cooldown<=0){
                bullets.push({
                    x:this.x,
                    y:this.y,
                    target:enemy
                });
                this.cooldown = 60;
                break;
            }
        }
    }

    draw(){
        ctx.fillStyle="cyan";
        ctx.beginPath();
        ctx.arc(this.x,this.y,20,0,Math.PI*2);
        ctx.fill();
    }
}

function updateBullets(){
    for(let i = bullets.length - 1; i >= 0; i--){
        let bullet = bullets[i];

        if(!bullet.target){
            bullets.splice(i,1);
            continue;
        }

        let dx = bullet.target.x - bullet.x;
        let dy = bullet.target.y - bullet.y;
        let dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < 8){
            bullet.target.health -= 10;

            if(bullet.target.health <= 0){
                gold += 10;
                enemies.splice(enemies.indexOf(bullet.target),1);
            }

            bullets.splice(i,1);
        } else {
            bullet.x += dx/dist * 6;
            bullet.y += dy/dist * 6;
        }
    }
}

function drawBullets(){
    ctx.fillStyle = "yellow";

    for(let bullet of bullets){
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, 5, 0, Math.PI*2);
        ctx.fill();
    }
}

function startWave(){
    for(let i=0;i<5;i++){
        setTimeout(()=>{
            enemies.push(new Enemy());
        }, i*500);
    }
}

canvas.addEventListener("click", e=>{
    let rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    if(gold >= 50){
        towers.push(new Tower(x,y));
        gold -= 50;
    }
});

function gameLoop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    document.getElementById("gold").textContent = gold;
    document.getElementById("wave").textContent = wave;
    document.getElementById("lives").textContent = lives;

    ctx.strokeStyle="white";
    ctx.lineWidth=40;
    ctx.beginPath();
    ctx.moveTo(0,250);
    ctx.lineTo(900,250);
    ctx.stroke();

    enemies.forEach(e=>{e.update(); e.draw();});
    towers.forEach(t=>{t.update(); t.draw();});

    updateBullets();
    drawBullets();

    if(lives<=0){
        alert("Game Over");
        location.reload();
    }

    requestAnimationFrame(gameLoop);
}

function goBack(){
    window.location.href = "index.html";
}

gameLoop();
</script>

</body>
</html>
