<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let gold = 1000;   // 🔥 STARTING GOLD UPDATED
let wave = 1;
let lives = 10;

let enemies = [];
let towers = [];
let bullets = [];

let waveInProgress = false;

class Enemy{
    constructor(){
        this.x = 0;
        this.y = 250;
        this.speed = 2 + wave * 0.2;
        this.health = 30 + wave * 10;
        this.maxHealth = this.health;
    }

    update(){
        this.x += this.speed;

        if(this.x > canvas.width){
            lives--;
            this.remove();
        }
    }

    remove(){
        const index = enemies.indexOf(this);
        if(index > -1) enemies.splice(index,1);
    }

    draw(){
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(this.x,this.y,15,0,Math.PI*2);
        ctx.fill();

        // Health bar
        ctx.fillStyle = "green";
        ctx.fillRect(this.x-15, this.y-25, 30*(this.health/this.maxHealth),5);
    }
}

class Tower{
    constructor(x,y){
        this.x=x;
        this.y=y;
        this.range=120;
        this.cooldown=0;
    }

    update(){
        if(this.cooldown>0) this.cooldown--;

        for(let enemy of enemies){
            let dx = enemy.x - this.x;
            let dy = enemy.y - this.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if(dist < this.range && this.cooldown<=0){
                bullets.push({
                    x:this.x,
                    y:this.y,
                    target:enemy
                });
                this.cooldown = 40;
                break;
            }
        }
    }

    draw(){
        ctx.fillStyle="cyan";
        ctx.beginPath();
        ctx.arc(this.x,this.y,20,0,Math.PI*2);
        ctx.fill();
    }
}

function updateBullets(){
    for(let i = bullets.length - 1; i >= 0; i--){
        let bullet = bullets[i];

        if(!enemies.includes(bullet.target)){
            bullets.splice(i,1);
            continue;
        }

        let dx = bullet.target.x - bullet.x;
        let dy = bullet.target.y - bullet.y;
        let dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < 8){
            bullet.target.health -= 10;

            if(bullet.target.health <= 0){
                gold += 10 + wave;
                bullet.target.remove();
            }

            bullets.splice(i,1);
        } else {
            bullet.x += dx/dist * 6;
            bullet.y += dy/dist * 6;
        }
    }
}

function drawBullets(){
    ctx.fillStyle = "yellow";

    for(let bullet of bullets){
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, 5, 0, Math.PI*2);
        ctx.fill();
    }
}

function startWave(){
    if(waveInProgress) return;

    waveInProgress = true;

    let enemyCount = 5 + wave * 2;

    for(let i=0;i<enemyCount;i++){
        setTimeout(()=>{
            enemies.push(new Enemy());
        }, i*400);
    }
}

canvas.addEventListener("click", e=>{
    let rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    if(gold >= 50){
        towers.push(new Tower(x,y));
        gold -= 50;
    }
});

function gameLoop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    document.getElementById("gold").textContent = gold;
    document.getElementById("wave").textContent = wave;
    document.getElementById("lives").textContent = lives;

    ctx.strokeStyle="white";
    ctx.lineWidth=40;
    ctx.beginPath();
    ctx.moveTo(0,250);
    ctx.lineTo(900,250);
    ctx.stroke();

    enemies.forEach(e=>{e.update(); e.draw();});
    towers.forEach(t=>{t.update(); t.draw();});

    updateBullets();
    drawBullets();

    if(waveInProgress && enemies.length === 0){
        wave++;
        waveInProgress = false;
        gold += 20;
    }

    if(lives<=0){
        alert("Game Over");
        location.reload();
    }

    requestAnimationFrame(gameLoop);
}

function goBack(){
    window.location.href = "index.html";
}

gameLoop();
</script>
