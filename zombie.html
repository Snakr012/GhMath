
<!DOCTYPE html>
<html>
<head>
<title>Zombie Survival</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: #222;
    color: white;
    font-family: Arial;
    text-align: center;
}

canvas {
    display: block;
    margin: 0 auto;
    background: #333;
}

#backBtn {
    position:absolute;
    top:15px;
    left:15px;
    background:black;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>
<body>

<button id="backBtn" onclick="goHome()">⬅ Hub</button>
<h1>🧟 Zombie Survival</h1>
<p>WASD to move | Survive as long as possible</p>
<canvas id="gameCanvas" width="800" height="500"></canvas>

<script>
<script>



const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let map = { width: 2000, height: 2000 };
let camera = { x: 0, y: 0 };
let shake = 0;

let keys = {};
let bullets = [];
let zombies = [];
let blood = [];
let grenades = [];

let score = 0;
let wave = 1;
let inShop = false;

document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);




let player = {
    x: 1000,
    y: 1000,
    size: 20,
    speed: 4,
    health: 100,
    ammo: 10,
    maxAmmo: 10,
    reloading: false
};

let weaponType = "pistol"; // pistol, rifle, shotgun

function movePlayer(){
    if(keys["w"]) player.y -= player.speed;
    if(keys["s"]) player.y += player.speed;
    if(keys["a"]) player.x -= player.speed;
    if(keys["d"]) player.x += player.speed;
}




canvas.addEventListener("click", shoot);
canvas.addEventListener("contextmenu", e=>{
    e.preventDefault();
    throwGrenade();
});

function shoot(e){
    if(player.reloading || player.ammo <= 0) return;

    player.ammo--;

    let rect = canvas.getBoundingClientRect();
    let mx = e.clientX - rect.left + camera.x;
    let my = e.clientY - rect.top + camera.y;
    let angle = Math.atan2(my - player.y, mx - player.x);

    if(weaponType === "shotgun"){
        for(let i=-2;i<=2;i++){
            bullets.push({
                x: player.x,
                y: player.y,
                dx: Math.cos(angle+i*0.1)*8,
                dy: Math.sin(angle+i*0.1)*8
            });
        }
    } else {
        bullets.push({
            x: player.x,
            y: player.y,
            dx: Math.cos(angle)*8,
            dy: Math.sin(angle)*8
        });
    }

    if(player.ammo <= 0) reload();
}

function reload(){
    player.reloading = true;
    setTimeout(()=>{
        player.ammo = player.maxAmmo;
        player.reloading = false;
    },1500);
}

function throwGrenade(){
    zombies.forEach(z=>{
        let dist = Math.hypot(z.x-player.x, z.y-player.y);
        if(dist < 150){
            z.health -= 5;
        }
    });
}




function spawnWave(){
    zombies = [];
    for(let i=0;i<wave*5;i++){
        zombies.push(spawnZombie(false));
    }

    if(wave % 5 === 0){
        zombies.push(spawnZombie(true)); // boss
    }
}

function spawnZombie(boss){
    return {
        x: Math.random()*map.width,
        y: Math.random()*map.height,
        size: boss?40:20,
        speed: boss?1:1.5,
        health: boss?20:3,
        boss: boss
    };
}

function moveZombies(){
    zombies.forEach((z,zi)=>{
        let dx = player.x - z.x;
        let dy = player.y - z.y;
        let dist = Math.hypot(dx,dy);

        z.x += (dx/dist)*z.speed;
        z.y += (dy/dist)*z.speed;

        if(dist < player.size + z.size){
            player.health -= 0.2;
            shake = 10;
        }

        bullets.forEach((b,bi)=>{
            let d = Math.hypot(b.x-z.x, b.y-z.y);
            if(d < z.size){
                z.health--;
                bullets.splice(bi,1);
                blood.push({x:z.x,y:z.y,life:30});

                if(z.health<=0){
                    zombies.splice(zi,1);
                    score+=10;
                }
            }
        });
    });

    if(zombies.length===0){
        wave++;
        spawnWave();
    }
}




function updateBullets(){
    bullets.forEach((b,i)=>{
        b.x+=b.dx;
        b.y+=b.dy;
        if(b.x<0||b.y<0||b.x>map.width||b.y>map.height){
            bullets.splice(i,1);
        }
    });
}

function drawBlood(){
    blood.forEach((b,i)=>{
        ctx.fillStyle="red";
        ctx.globalAlpha=b.life/30;
        ctx.beginPath();
        ctx.arc(b.x-camera.x,b.y-camera.y,5,0,Math.PI*2);
        ctx.fill();
        ctx.globalAlpha=1;
        b.life--;
        if(b.life<=0) blood.splice(i,1);
    });
}



function draw(){
    ctx.save();

    if(shake>0){
        ctx.translate(Math.random()*shake-shake/2, Math.random()*shake-shake/2);
        shake--;
    }

    camera.x = player.x - canvas.width/2;
    camera.y = player.y - canvas.height/2;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Map background
    ctx.fillStyle="#333";
    ctx.fillRect(-camera.x,-camera.y,map.width,map.height);

    // Player
    ctx.fillStyle="cyan";
    ctx.beginPath();
    ctx.arc(player.x-camera.x,player.y-camera.y,player.size,0,Math.PI*2);
    ctx.fill();

    // Zombies
    zombies.forEach(z=>{
        ctx.fillStyle=z.boss?"purple":"lime";
        ctx.beginPath();
        ctx.arc(z.x-camera.x,z.y-camera.y,z.size,0,Math.PI*2);
        ctx.fill();
    });

    // Bullets
    ctx.fillStyle="yellow";
    bullets.forEach(b=>{
        ctx.beginPath();
        ctx.arc(b.x-camera.x,b.y-camera.y,4,0,Math.PI*2);
        ctx.fill();
    });

    drawBlood();

    ctx.restore();

    // UI
    ctx.fillStyle="white";
    ctx.fillText("Health: "+Math.floor(player.health),20,20);
    ctx.fillText("Ammo: "+player.ammo+"/"+player.maxAmmo,20,40);
    ctx.fillText("Score: "+score,20,60);
    ctx.fillText("Wave: "+wave,20,80);
}




function giveXP(){
    let hubData = JSON.parse(localStorage.getItem("playerHubData"));
    if(!hubData) return;

    let earnedXP = wave*20 + score;
    hubData.xp += earnedXP;
    hubData.totalScore += score;

    let requiredXP = hubData.level * 100;
    if(hubData.xp >= requiredXP){
        hubData.xp -= requiredXP;
        hubData.level++;
        alert("LEVEL UP! Now Level "+hubData.level);
    }

    localStorage.setItem("playerHubData", JSON.stringify(hubData));
}




function gameLoop(){

    if(player.health>0){
        movePlayer();
        updateBullets();
        moveZombies();
    } else {
        giveXP();
        alert("Game Over! Score: "+score);
        window.location.reload();
    }

    draw();
    requestAnimationFrame(gameLoop);
}


    

function goHome(){
    window.location.href="index.html";
}




spawnWave();
gameLoop();

</script>
</script>

</body>
</html>
